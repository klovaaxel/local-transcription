# Publishes a self-updatable release when a v* tag is pushed (or manually from
# the Actions tab). Builds Windows, Android, and Linux, computes updates.json,
# and creates the GitHub release that lib/update/ reads
# (releases/latest/download/updates.json).
#
# Bump pubspec.yaml FIRST - it names the tag (v<version>) and the manifest
# build number. Android's +build number must strictly increase or the updater
# will refuse the install.
#
# Required secrets (android job):
#   ANDROID_KEYSTORE_BASE64 - base64 of the beta keystore
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the build refuses to produce a shippable APK (a debug-signed
# APK can never be upgraded later by a properly signed one).

name: Publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes (optional)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer + portable zip
        shell: pwsh
        run: pwsh -File tool/package/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Forelasning-*-windows-x64-setup.exe
            dist/Forelasning-*-windows-x64.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD are not set. A debug-signed APK must never ship - it can never be upgraded."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/ci-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=ci-keystore.jks
          storeType=PKCS12
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - name: Build per-ABI APKs
        run: flutter build apk --release --split-per-abi
      - name: Build universal APK (the file the self-updater installs)
        run: flutter build apk --release
      - name: Collect artifacts
        run: |
          VERSION=$(grep -oP '^version:\s*\K.+' pubspec.yaml | cut -d+ -f1)
          mkdir -p dist
          # Split builds produce app-<abi>-release.apk; the plain build's
          # app-release.apk carries no ABI segment - note the glob must not
          # exclude it, which app-*-release.apk does.
          for apk in build/app/outputs/flutter-apk/app-*.apk; do
            base=$(basename "$apk" .apk)
            case "$base" in
              app-release)
                # Universal build - the one the self-updater installs.
                cp "$apk" "dist/Forelasning-$VERSION-android-universal.apk" ;;
              *)
                abi=${base#app-}; abi=${abi%-release}
                cp "$apk" "dist/Forelasning-$VERSION-android-$abi.apk" ;;
            esac
          done
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/Forelasning-*-android-*.apk
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Linux toolchain (desktop bundle + .deb + llama.cpp source build)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            patchelf fakeroot unzip rsync
      - name: Build .deb
        run: bash tool/package/build_linux_deb.sh
      - name: Verify the .deb in a clean Ubuntu 24.04 container
        run: bash tool/package/verify_deb_docker.sh dist/forelasning_*_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/forelasning_*_amd64.deb
          if-no-files-found: error

  publish:
    needs: [windows, android, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect dist/
        run: |
          mkdir -p dist
          cp -v artifacts/windows/* dist/
          cp -v artifacts/android/* dist/
          cp -v artifacts/linux/* dist/
      - name: Write manifest and create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -File tool/package/publish_update.ps1 -Repo klovaaxel/local-transcription -Notes "${{ inputs.notes }}"
